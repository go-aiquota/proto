name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # pwsh (the Windows default shell) mis-tokenizes an unquoted
        # -flag=value.ext argument on this runner (observed:
        # "-coverprofile=cover.out" split into "-coverprofile=cover" and a
        # bare ".out", which go test then tried to import as a package) —
        # bash (Git for Windows, present on every GitHub-hosted Windows
        # runner) sidesteps it and matches the other two OSes' shell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: '0'
      - name: Test
        run: go test -count=1 -coverprofile=cover.out ./...
        env:
          CGO_ENABLED: '0'
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (subprocess round-trip incl.)
        run: go test -race -count=1 ./...

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  crossbuild:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: s390x }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Cross-compile (CGO=0)
        run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
